name: Build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          # SDK 10 builds (global.json); the 8.0 SDK brings the .NET 8 runtime the net8.0 tests run on.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build Jyro.slnx -c Release

      - name: Test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet test Jyro.slnx -c Release --no-build --logger "console;verbosity=normal"
